name: Deploy validated video feeds

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: feed-publication
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every committed public feed
        run: |
          python -m pip install -r scripts/requirements-protocol.txt
          python scripts/check-protocol.py docs/*/feed.json
      - name: Build legacy HTML routes outside the Git tree
        run: python scripts/prepare-pages.py --source docs --output "$RUNNER_TEMP/retoob-pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/retoob-pages
      - id: deployment
        uses: actions/deploy-pages@v4
